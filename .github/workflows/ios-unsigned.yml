name: Build unsigned iOS IPA

# Produces a device-architecture .ipa with code signing disabled, for sideloading
# with SideStore / AltStore / Sideloadly using a free Apple ID.
#
# Why this exists: EAS Build's `internal` distribution needs an ad-hoc
# provisioning profile, which is a paid Developer Program feature. Building
# unsigned sidesteps Apple's signing infrastructure entirely and defers signing
# to the phone. See docs/SIDELOADING.md.
#
# macOS runners are free on public repositories; on private ones they bill at a
# 10x minute multiplier, so this is set to run manually rather than on push.

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

# A macOS runner is expensive to leave spinning; if a newer run starts, the
# older one has nothing useful left to produce.
concurrency:
  group: ios-unsigned-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # Pinned rather than macos-latest: a runner image bump that changes the
    # bundled Xcode should be a deliberate choice, not a surprise broken build.
    # macos-15 ships Xcode 16.4, whose SwiftPM cannot resolve the package graph
    # Expo SDK 57 / React Native 0.86 generate for ExpoModulesJSI.
    runs-on: macos-26
    timeout-minutes: 45
    defaults:
      run:
        working-directory: mobile

    steps:
      - uses: actions/checkout@v4

      - name: Select the newest installed Xcode
        # Logged unconditionally: when a build breaks in Expo's or React
        # Native's native tooling, the toolchain version is the first thing
        # worth knowing, and the default is not always the newest present.
        run: |
          ls -d /Applications/Xcode*.app
          newest="$(ls -d /Applications/Xcode*.app | sort -V | tail -n1)"
          echo "Selecting $newest"
          sudo xcode-select -s "$newest/Contents/Developer"
          xcodebuild -version
          swift --version

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install JS dependencies
        # The tree has a react-dom peer conflict that `expo install` already
        # overrides; npm ci needs to be told the same thing.
        run: npm ci --legacy-peer-deps

      - name: Typecheck and test
        run: |
          npx tsc --noEmit
          npx jest

      - name: Generate the native iOS project
        # Also runs pod install, which needs macOS.
        run: npx expo prebuild --platform ios --clean

      - name: Resolve workspace and scheme
        id: xcode
        run: |
          workspace="$(ls -d ios/*.xcworkspace | head -n1)"
          scheme="$(basename "$workspace" .xcworkspace)"
          echo "workspace=$workspace" >> "$GITHUB_OUTPUT"
          echo "scheme=$scheme"       >> "$GITHUB_OUTPUT"
          echo "Building scheme '$scheme' from '$workspace'"

      - name: Resolve Swift package dependencies
        # Done as its own step so a package-resolution failure is reported
        # plainly, instead of being interleaved into the build log where
        # xcodebuild prints the reason on continuation lines a formatter drops.
        run: |
          xcodebuild -resolvePackageDependencies \
            -workspace "${{ steps.xcode.outputs.workspace }}" \
            -scheme "${{ steps.xcode.outputs.scheme }}" \
            -derivedDataPath build

      - name: Build unsigned .app
        run: |
          set -o pipefail
          # Always keep the raw log: xcbeautify is good to read but discards the
          # continuation lines that carry xcodebuild's actual diagnostics.
          formatter=cat
          command -v xcbeautify >/dev/null && formatter=xcbeautify
          xcodebuild \
            -workspace "${{ steps.xcode.outputs.workspace }}" \
            -scheme "${{ steps.xcode.outputs.scheme }}" \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" \
            build \
            2>&1 | tee "$RUNNER_TEMP/xcodebuild.log" | "$formatter"

      - name: Show raw build diagnostics
        if: failure()
        run: |
          echo "::group::errors"
          grep -nE "error:|Could not resolve|cannot find|no such module" \
            "$RUNNER_TEMP/xcodebuild.log" | head -60 || true
          echo "::endgroup::"
          echo "::group::last 200 raw lines"
          tail -200 "$RUNNER_TEMP/xcodebuild.log" || true
          echo "::endgroup::"

      - name: Embed entitlements into the binaries
        # The build is unsigned, which loses the App Group unless this step puts
        # it back.
        #
        # SideStore and AltStore read an app's entitlements out of the Mach-O
        # code signature -- AltSign's ALTApplication calls `ldid::Entitlements`
        # on each binary -- and nothing in that pipeline ever reads an
        # entitlements file shipped alongside the .ipa. With signing disabled
        # there is no entitlements blob to read, so the installer concludes the
        # app uses no App Groups, sets the feature off on the App ID, registers
        # no group, and issues a profile without one. It then signs every bundle
        # with that profile's entitlements. The app and the widget end up in
        # separate sandboxes with no shared container, silently.
        #
        # The ad-hoc signature applied here is only a carrier. The installer
        # replaces it with its own certificate; it just has to be able to read
        # the entitlements first. Nested code is signed before the bundle that
        # embeds it, which is the order codesign requires.
        run: |
          set -euo pipefail
          app="$(ls -d build/Build/Products/Release-iphoneos/*.app | head -n1)"

          # `expo prebuild` writes the app's entitlements next to its
          # Info.plist; @bacons/apple-targets writes each extension's to
          # ios/.targets/<product name>/generated.entitlements.
          entitlements_for() {
            for candidate in \
              "ios/.targets/$1/generated.entitlements" \
              "ios/$1/$1.entitlements"; do
              if [ -f "$candidate" ]; then echo "$candidate"; return 0; fi
            done
            return 1
          }

          sign_bundle() {
            name="$(basename "$1")"
            name="${name%.*}"
            if ! ent="$(entitlements_for "$name")"; then
              echo "::error::no entitlements file found for $name"
              exit 1
            fi
            echo "Signing $name with $ent"
            codesign --force --sign - --entitlements "$ent" "$1"
          }

          # Frameworks carry no entitlements of their own, but a bundle cannot
          # be signed while the code nested inside it is unsigned. -depth signs
          # the innermost first.
          while IFS= read -r nested; do
            codesign --force --sign - "$nested"
          done < <(find "$app" -depth \( -name "*.framework" -o -name "*.dylib" \))

          for ext in "$app"/PlugIns/*.appex; do
            [ -d "$ext" ] || continue
            sign_bundle "$ext"
          done
          sign_bundle "$app"

      - name: Verify the App Group survived into every bundle
        # Losing it here is invisible on the phone -- the widget just renders
        # "Not paired" forever -- so it is worth failing the build over.
        run: |
          set -uo pipefail
          app="$(ls -d build/Build/Products/Release-iphoneos/*.app | head -n1)"
          status=0
          for bundle in "$app" "$app"/PlugIns/*.appex; do
            [ -d "$bundle" ] || continue
            name="$(basename "$bundle")"
            echo "::group::$name entitlements"
            embedded="$(codesign -d --entitlements :- "$bundle" 2>/dev/null || true)"
            echo "$embedded"
            echo "::endgroup::"
            if ! printf '%s' "$embedded" | grep -aq "application-groups"; then
              echo "::error::$name carries no App Group; a sideload of this build cannot share data"
              status=1
            fi
          done
          exit "$status"

      - name: Package as .ipa
        # An .ipa is just a zip with the .app inside a top-level Payload/ folder.
        run: |
          app="$(ls -d build/Build/Products/Release-iphoneos/*.app | head -n1)"
          echo "Packaging $app"

          # Reported, not enforced. The widget target is currently switched off
          # (see docs/WIDGETS.md), so no extension is the expected state -- but
          # when it is switched back on, a silently missing .appex looks exactly
          # like "widgets don't work" on the phone, so it is worth printing.
          if ls "$app"/PlugIns/*.appex >/dev/null 2>&1; then
            echo "Embedded extensions:"
            ls -d "$app"/PlugIns/*.appex
          else
            echo "No app extensions embedded (widget target disabled)."
          fi

          rm -rf Payload
          mkdir -p Payload
          cp -R "$app" Payload/
          zip -qry wol-unlock-unsigned.ipa Payload
          rm -rf Payload
          ls -lh wol-unlock-unsigned.ipa

      - name: Verify the binary targets a device, not the simulator
        # A simulator build would upload fine and then fail to install on the
        # phone, so fail loudly here instead.
        run: |
          app="$(ls -d build/Build/Products/Release-iphoneos/*.app | head -n1)"
          binary="$app/$(basename "$app" .app)"
          echo "Inspecting $binary"
          lipo -info "$binary"
          if lipo -info "$binary" | grep -qi "x86_64"; then
            echo "::error::binary contains x86_64 — this looks like a simulator build"
            exit 1
          fi

      - name: Collect entitlements for signing
        # The binaries now carry these themselves, which is what the
        # AltStore-family installers actually read. Kept as an artifact for
        # signing tools that instead take an entitlements plist as an argument
        # (Sideloadly), and because seeing what was requested is useful when
        # comparing against what a profile came back with.
        run: |
          mkdir -p entitlements
          find ios -name "*.entitlements" -print -exec sh -c \
            'cp "$1" "entitlements/$(basename "$(dirname "$1")")-$(basename "$1")"' _ {} \;
          ls -l entitlements

      - uses: actions/upload-artifact@v4
        with:
          name: wol-unlock-unsigned-ipa
          path: |
            mobile/wol-unlock-unsigned.ipa
            mobile/entitlements
          retention-days: 14
          if-no-files-found: error
