[project]
name = "wol-unlock"
version = "1.0.0"
description = "Signed LAN service for Wake-on-LAN and logind session unlock"
requires-python = ">=3.11"
dependencies = [
    "aiohttp>=3.9",
    "zeroconf>=0.131",
    "cryptography>=42",
    "qrcode>=7.4",
    "rich>=13",
]

[project.scripts]
wol-unlock = "wol_unlock.__main__:main"
wol-unlockctl = "wol_unlock.cli.__main__:main"

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wol_unlock"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
